[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "forking-agent"
version = "0.1.0"
description = "A research agent that explores alternatives by forking itself into git worktrees."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["agentknit"]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "mypy", "ruff"]

[project.scripts]
forking-agent = "forking_agent._cli:main"

[tool.hatch.build.targets.wheel]
packages = ["forking_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
